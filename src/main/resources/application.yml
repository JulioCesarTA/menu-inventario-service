spring:
  application:
    name: menu-inventario-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://comedor:comedor123@localhost:27017/menu_inventario?authSource=admin}
      auto-index-creation: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  sns:
    topicDominioMenuArn: arn:aws:sns:us-east-1:000000000000:dominio-menu

logging:
  level:
    root: INFO
    com.uagrm.comedor: DEBUG
